name: Signed plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-build.txt
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify and build the admin frontend
        run: |
          npm run check
          npm run build
          npm test
      - name: Sign the installable package
        env:
          MINISHOP_BLACKLIST_SIGNING_KEY: ${{ secrets.MINISHOP_BLACKLIST_SIGNING_KEY }}
        run: python scripts/build-package.py build --key-env MINISHOP_BLACKLIST_SIGNING_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: minishop-blacklist-${{ github.sha }}
          path: |
            dist/release/minishop-plugin.json
            dist/release/packages/*.zip
            dist/release/publisher.pub
            dist/release/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: minishop-blacklist-${{ github.sha }}
          path: dist/release
      - name: Publish package files, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-package.py
